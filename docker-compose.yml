services:
  db:
    image: postgres:16
    container_name: cs_exam_coach_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: how060507!
      POSTGRES_DB: cs_exam_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs_exam_coach"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: cs_exam_coach_backend
    env_file:
      - ./backend/.env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: cs_exam_coach_frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

  chroma:
    image: chromadb/chroma:latest
    container_name: cs_exam_coach_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
